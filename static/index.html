<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan risk check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <h1>Loan risk check</h1>
      <p>Enter an application and see how likely the borrower is to default.</p>
    </header>

    <div class="grid">
      <form id="form" class="form" novalidate>
        <fieldset>
          <legend>Applicant</legend>
          <label>Age
            <input type="number" name="person_age" min="18" max="100" value="28" required>
          </label>
          <label>Yearly income
            <input type="number" name="person_income" min="1" step="any" value="60000" required>
          </label>
          <label>Home ownership
            <select name="person_home_ownership">
              <option value="RENT">Rent</option>
              <option value="OWN">Own</option>
              <option value="MORTGAGE">Mortgage</option>
              <option value="OTHER">Other</option>
            </select>
          </label>
          <label>Years employed
            <input type="number" name="person_emp_length" min="0" step="any" value="4" required>
          </label>
        </fieldset>

        <fieldset>
          <legend>Loan</legend>
          <label>Purpose
            <select name="loan_intent">
              <option value="PERSONAL">Personal</option>
              <option value="EDUCATION">Education</option>
              <option value="MEDICAL">Medical</option>
              <option value="VENTURE">Venture</option>
              <option value="HOMEIMPROVEMENT">Home improvement</option>
              <option value="DEBTCONSOLIDATION">Debt consolidation</option>
            </select>
          </label>
          <label>Loan amount
            <input type="number" name="loan_amnt" min="1" step="any" value="12000" required>
          </label>
          <label>Interest rate (%)
            <input type="number" name="loan_int_rate" min="0" step="any" value="11.5" required>
          </label>
          <label>Share of income
            <input type="number" name="loan_percent_income" id="pct" readonly tabindex="-1">
            <small id="pctHint">Worked out from loan amount and income</small>
          </label>
          <div class="field">
            <span class="lbl">Loan grade</span>
            <div class="grades" id="grades" role="radiogroup" aria-label="Loan grade"></div>
            <input type="hidden" name="loan_grade" value="B">
          </div>
        </fieldset>

        <fieldset>
          <legend>Credit history</legend>
          <label>Length of history (years)
            <input type="number" name="cb_person_cred_hist_length" min="0" value="5" required>
          </label>
          <div class="field">
            <span class="lbl">Past default on file</span>
            <div class="seg" id="seg">
              <button type="button" data-v="N" class="on">No</button>
              <button type="button" data-v="Y">Yes</button>
            </div>
            <input type="hidden" name="cb_person_default_on_file" value="N">
          </div>
        </fieldset>

        <button class="go" id="go" type="submit">Check risk</button>
      </form>

      <aside class="panel" id="panel" data-state="idle" aria-live="polite">
        <svg viewBox="0 0 220 130" class="gauge" aria-hidden="true">
          <path class="track" d="M 20 110 A 90 90 0 0 1 200 110" pathLength="100"/>
          <path class="fill" id="fill" d="M 20 110 A 90 90 0 0 1 200 110" pathLength="100"/>
          <line id="tick" class="tick" x1="0" y1="0" x2="0" y2="0"/>
        </svg>
        <div class="readout">
          <div class="pct"><span id="pctNum">--</span><i>%</i></div>
          <div class="verdict" id="verdict">Waiting for an application</div>
        </div>
        <p class="note" id="note">Fill in the form and choose Check risk.</p>
        <dl class="facts" id="facts" hidden>
          <div><dt>Cut-off</dt><dd id="thr">--</dd></div>
          <div><dt>Decision</dt><dd id="dec">--</dd></div>
        </dl>
      </aside>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
